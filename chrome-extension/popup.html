<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h1>AutoApply Helper</h1>
    </div>

    <div class="status-area" id="status-display"></div>

    <div class="actions">
        <button id="fill-btn" class="primary-btn">Fill Form</button>
    </div>

    <div class="logs-header">
        <span class="logs-title">Logs</span>
        <button id="clear-logs-btn" class="secondary-btn clear-btn">Clear</button>
    </div>
    
    <div class="logs-container" id="logs-view">
        <div class="log-entry"><span class="log-level-info">Loading...</span></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
